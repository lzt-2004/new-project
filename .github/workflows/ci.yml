name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试与打包
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fulfillflow-backend
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: fulfillflow-backend/pom.xml
      - name: 运行测试
        run: mvn --batch-mode test
      - name: 构建 Jar
        run: mvn --batch-mode package -DskipTests

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fulfillflow-web
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
      - name: 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fulfillflow-web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 构建前端
        run: npm run build
